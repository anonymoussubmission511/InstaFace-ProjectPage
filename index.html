    Answer:
    No, the <meta name="description" content="..."> tag will not be shown directly on your website. Instead, it serves as a summary 
    for search engines and social media previews. When someone searches for your site or shares your link, this description may appear 
    below the link in search results or as part of the preview on social media platforms.

    To add text that will be visible on the webpage itself, you would place that content in a section of the index.html file (such as a 
    <p>, <h1>, or <div> tag) instead of a <meta> tag.

  -->

  <!--
    Step: 2

    I did not understand about 

    Social Media Title and Description Tags
    Can you describe with an example, how it works?

    Answer:
    The **social media title and description tags** (`og:title` and `og:description`) are **Open Graph meta tags**. These tags help control 
    what appears when someone shares your website link on social media platforms, such as Facebook, LinkedIn, or Twitter.

    Here's how they work:

    ### Example

    Suppose you add these tags to your `index.html`:

    ```html
    <meta property="og:title" content="My CVPR Paper on Facial Generation"/>
    <meta property="og:description" content="This research explores advanced facial generation techniques using neural rendering and 
    computer vision. Discover how we achieve realistic facial transformations."/>
    <meta property="og:image" content="https://yourusername.github.io/your-repository-name/static/images/banner_image.png" />
    <meta property="og:url" content="https://yourusername.github.io/your-repository-name/" />
    ```
    
    ### When Someone Shares Your Link

    Let’s say you share your website URL (`https://yourusername.github.io/your-repository-name/`) on Facebook or LinkedIn. Social media 
    platforms will use these Open Graph tags to display a preview of your site. Here’s what people might see in the preview:

    - **Title**: "My CVPR Paper on Facial Generation"
    - **Description**: "This research explores advanced facial generation techniques using neural rendering and computer vision. Discover 
    how we achieve realistic facial transformations."
    - **Image**: The image located at `static/images/banner_image.png`
    - **Link**: The URL of your site

    The preview would look something like this on social media:

      > **My CVPR Paper on Facial Generation**  
      > This research explores advanced facial generation techniques using neural rendering and computer vision. Discover how we achieve 
      realistic facial transformations.  
      > ![Banner Image](https://yourusername.github.io/your-repository-name/static/images/banner_image.png)  
      > [yourusername.github.io/your-repository-name](https://yourusername.github.io/your-repository-name/)

    ### Why This Is Useful

    By setting the `og:title`, `og:description`, `og:image`, and `og:url` tags, you control exactly how your page appears in social media 
    previews. This makes it more appealing and informative when shared, which can attract more clicks and interest.

    Let me know if that clarifies it!

  -->
  <meta property="og:title" content="SOCIAL MEDIA TITLE TAG"/>
  <meta property="og:description" content="SOCIAL MEDIA DESCRIPTION TAG TAG"/>

  <!--   
    Step: 4
    Update og:image with the path to an image that represents your paper (a figure from your paper, a banner, or a cover image). Place 
    this image in the static/images folder and update the file name accordingly.
  
    I am confused about the banner image 
    I gave a link <meta property="og:image" content="static/images/banner_image.png" />

    also added the image in the respective directory. But when I refresh my website I cannot see any changes.


    Answer:
    The `og:image` tag specifies an image for **social media previews only**, not for displaying directly on your website. When you 
    refresh your website, you won’t see this image unless you’ve also added it in the visible HTML part of the page.

    ### How to Check the Banner Image

    1. **Testing the Preview**:
      - To check if social media platforms can see your `og:image`, you can use tools like:
        - **Facebook Sharing Debugger**: [https://developers.facebook.com/tools/debug/](https://developers.facebook.com/tools/debug/)
        - **Twitter Card Validator**: [https://cards-dev.twitter.com/validator](https://cards-dev.twitter.com/validator)
      - Paste your website link in one of these tools, and it will show you how your link preview (including the banner image) will look on 
      social media.

    2. **Displaying the Image on Your Website (Optional)**:
      - If you want the banner image to show up on your website as well, you need to add it in the body section of `index.html`. For example, 
      near the top of your content, you can add:

        ```html
        <img src="static/images/banner_image.png" alt="Banner Image" style="width:100%;">
        ```

      - This line will display the banner image at the top of your website.

    ### Summary

    - **`og:image`** is for social media previews and won’t show up on your site directly.
    - To see the banner image directly on your webpage, add an `<img>` tag in the HTML body.
  -->

  <!-- Path to banner image, should be in the path listed below. Optimal dimenssions are 1200X630-->
  <meta property="og:image" content="static/image/your_banner_image.png" />
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
